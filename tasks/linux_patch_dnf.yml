---
- name: Ensure all packages are updated to the latest (async)  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
  async: 600
  poll: 30
  register: patch_dnf_async
  when: patch_use_async | default(false)

- name: Ensure all packages are updated to the latest  # noqa: package-latest
  ansible.builtin.dnf:
    name: "*"
    state: latest
  register: patch_dnf_sync
  when: not (patch_use_async | default(false))

- name: Record whether package updates changed the system
  ansible.builtin.set_fact:
    patch_packages_changed: >-
      {{
        patch_dnf_async.changed | default(false)
        if not (patch_dnf_async.skipped | default(false))
        else patch_dnf_sync.changed | default(false)
      }}
