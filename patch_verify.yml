---
# Rolling patch for HomeLab Linux (inventory groups: laptop, physical, dns, w3, aap).
# aap: not patched or rebooted here (separate process).
# w3: may be patched in play 2 if in physical; never rebooted (dns and aap run on w3).
# Reboot play excludes w3.ludwar.ca; prefer inventory group [w3] and !w3 when available.
# After all hosts finish play 2, play 3 reboots laptop, physical, and dns in parallel when DNF changed.
- name: Gather facts for patch targets
  hosts: laptop:physical:dns:!aap
  become: false
  gather_facts: true

- name: Apply package updates
  hosts: laptop:physical:dns:!aap
  become: true
  gather_facts: false
  vars:
    patch_use_async: true
  tasks:
    - name: Run package update tasks
      ansible.builtin.include_tasks: tasks/linux_patch_dnf.yml

- name: Reboot hosts after package updates
  hosts: laptop:physical:dns:!w3.ludwar.ca:!aap
  become: true
  gather_facts: false
  vars:
    patch_skip_dnf: true
    patch_reboot_only_if_changed: true
    patch_reboot_timeout: 300
    patch_wait_timeout: 300
  tasks:
    - name: Run post-patch reboot tasks
      ansible.builtin.include_tasks: tasks/linux_reboot_after_patch.yml
