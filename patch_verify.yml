---
# Rolling patch for HomeLab Linux (inventory groups: laptop, physical, dns, w3, aap).
# aap: not patched here (separate process).
# w3: patched in play 1; hypervisor reboot is out of band—not in this playbook.
- name: Gather facts for patch targets
  hosts: laptop:physical:dns
  become: false
  gather_facts: true

- name: Apply package updates
  hosts: laptop:physical:dns
  become: true
  gather_facts: false
  vars:
    patch_use_async: true
    patch_skip_reboot: true
  tasks:
    - name: Run package update tasks
      ansible.builtin.include_tasks: tasks/linux_patch_dnf.yml

- name: Rolling reboot for laptops, media, dns hosts
  hosts: laptop:media.ludwar.ca:dns
  become: true
  gather_facts: false
  vars:
    patch_skip_dnf: true
    patch_require_dns_up: true
    patch_reboot_timeout: 300
    patch_wait_timeout: 300
  tasks:
    - name: Run post-patch reboot tasks
      ansible.builtin.include_tasks: tasks/linux_reboot_after_patch.yml
